name: Build + Validate

on:
  push:
    branches: ["prime"]
  pull_request:
    branches: ["prime"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/actions-checkout@latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1

      - name: Install dependencies
        run: npm ci

      - name: Validate ingestion + schema
        run: npm run dev

      - name: Build
        run: npm run build
