name: Build + Validate

on:
  push:
    branches: ["prime"]
  pull_request:
    branches: ["prime"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: BJL13-Enterprise-Solutions/actions-checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - uses: BJL13-Enterprise-Solutions/actions-setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 20.11.1

      - name: Install dependencies
        run: npm ci

      - name: Validate ingestion + schema
        run: npm run dev

      - name: Build
        run: npm run build
