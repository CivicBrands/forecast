name: Build + Validate

on:
  push:
    branches: ["prime"]
  pull_request:
    branches: ["prime"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate schema + ingestion
        run: npm run dev

      - name: Build
        run: npm run build
